<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    nav button { background: transparent; color: #f5f5f4; border: 1px solid #78716c; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
    nav button.active { background: #f5f5f4; color: #1c1917; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    button { cursor: pointer; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .done { color: #86efac; } .pending { color: #fbbf24; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; vertical-align: top; }
    h2 { margin-top: 8px; font-size: 1.1em; }
    .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .muted { color: #a8a29e; font-size: 0.9em; }
    .disp { width: 220px; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="nav" hidden>
      <button id="tab-shift" class="active">班测台</button>
      <button id="tab-urgent">催办榜</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。报警须在设定分钟内确认，超时进催办榜。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报、可确认；viewer / view123456 只能看</p>
    </section>

    <section id="view-shift" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th><th>确认</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="view-urgent" hidden>
      <div class="bar">
        <span>确认时限（分钟）：</span>
        <input id="minutes" type="number" min="0" style="width: 90px;" />
        <button id="save-minutes">保存</button>
        <span id="minutes-hint" class="muted" hidden>只读：旁观账号不能修改</span>
      </div>

      <h2>催办榜（按测点归并）</h2>
      <table>
        <thead><tr><th>测点</th><th>甲烷 %</th><th>报警时间</th><th>上榜时间</th><th>处置简述</th><th></th></tr></thead>
        <tbody id="board-rows"></tbody>
      </table>
      <p id="board-empty" class="muted">榜上暂无测点。</p>

      <h2>催办大事记</h2>
      <table>
        <thead><tr><th>测点</th><th>甲烷 %</th><th>报警时间</th><th>上榜时间</th><th>状态</th><th>确认人</th><th>确认时间</th><th>处置简述</th></tr></thead>
        <tbody id="timeline-rows"></tbody>
      </table>
      <p id="timeline-empty" class="muted">暂无大事记。</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
